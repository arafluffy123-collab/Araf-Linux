<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Linux-Mac Hybrid OS</title>
    <style>
        :root {
            --bg-glass: rgba(30, 30, 30, 0.85);
            --border-glass: rgba(255, 255, 255, 0.2);
            --accent-color: #3b82f6;
            --text-color: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6, #7c3aed);
            color: var(--text-color);
        }

        /* --- TOP TASKBAR --- */
        #taskbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 44px;
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 9999;
        }

        .taskbar-left, .taskbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #taskbar-apps {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- BUTTONS (Rounded Rectangles) --- */
        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--border-glass);
            color: var(--text-color);
            padding: 6px 16px;
            border-radius: 8px; /* Rounded Rectangle */
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.25); }
        .btn:active { transform: scale(0.95); }
        #menu-btn { background: var(--accent-color); }

        #clock {
            font-size: 14px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 14px;
            border-radius: 20px;
        }

        /* --- DESKTOP AREA --- */
        #desktop {
            position: absolute;
            top: 44px;
            bottom: 90px;
            left: 0;
            width: 100%;
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            gap: 25px;
            align-content: flex-start;
            z-index: 10;
        }

        .desktop-icon {
            width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
            gap: 8px;
        }

        .icon-img {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        .desktop-icon:hover .icon-img { transform: scale(1.08); background: rgba(255, 255, 255, 0.2); }
        .icon-label { font-size: 12px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* --- MAC OS DOCK --- */
        #dock-container {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }

        #dock {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(25px);
            padding: 12px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .dock-item {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .dock-item:hover { transform: scale(1.25) translateY(-8px); }

        /* --- ALL APPS MENU --- */
        #apps-menu {
            position: absolute;
            top: 50px;
            left: 15px;
            width: 280px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 10000;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .menu-item:hover { background: rgba(255, 255, 255, 0.15); }

        /* --- WINDOWS SYSTEM --- */
        .window {
            position: absolute;
            top: 100px;
            left: 150px;
            width: 620px;
            height: 420px;
            background: #181818;
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 500;
        }

        .window-header {
            background: #252525;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            cursor: move;
        }

        .window-controls { display: flex; gap: 8px; }
        .control-dot { width: 13px; height: 13px; border-radius: 50%; cursor: pointer; }
        .dot-close { background: #ef4444; }
        .dot-min { background: #f59e0b; }
        .dot-max { background: #10b981; }
        .window-content { flex: 1; position: relative; }

        /* Apps Interior */
        .browser-container { display: flex; flex-direction: column; width: 100%; height: 100%; background: #fff; color: #000; }
        .browser-bar { background: #f1f5f9; padding: 8px 12px; display: flex; gap: 10px; border-bottom: 1px solid #e2e8f0; }
        .browser-input { flex: 1; padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px; outline: none; }
        .browser-page { flex: 1; padding: 40px; text-align: center; background: #f8fafc; }
        .terminal-body { width: 100%; height: 100%; background: #09090b; color: #22c55e; font-family: monospace; padding: 15px; overflow-y: auto; }
        .terminal-input-line { display: flex; width: 100%; }
        .terminal-input-line input { background: transparent; border: none; color: #22c55e; font-family: monospace; font-size: 14px; outline: none; flex: 1; }

        .firefox-icon { background: linear-gradient(45deg, #f97316, #ec4899); }
        .terminal-icon { background: #27272a; border: 1px solid #3f3f46; }
    </style>
</head>
<body>

    <!-- 1. TASKBAR & MENU BUTTON -->
    <div id="taskbar">
        <div class="taskbar-left">
            <button class="btn" id="menu-btn">Menu</button>
            <div id="taskbar-apps"></div>
        </div>
        <div class="taskbar-right">
            <div id="clock">00:00:00 AM</div>
        </div>
    </div>

    <!-- ALL APPS MENU PANEL -->
    <div id="apps-menu">
        <!-- 2 & 3. Menu Launcher Buttons -->
        <div class="menu-item" id="menu-firefox"><span class="icon-img firefox-icon" style="width:32px; height:32px; font-size:18px;">🦊</span><span>Fake Firefox</span></div>
        <div class="menu-item" id="menu-terminal"><span class="icon-img terminal-icon" style="width:32px; height:32px; font-size:18px;">💻</span><span>Terminal</span></div>
    </div>

    <!-- DESKTOP AREA -->
    <div id="desktop">
        <!-- 4 & 5. Desktop Shortcut Buttons -->
        <div class="desktop-icon" id="desk-firefox"><div class="icon-img firefox-icon">🦊</div><div class="icon-label">Fake Firefox</div></div>
        <div class="desktop-icon" id="desk-terminal"><div class="icon-img terminal-icon">💻</div><div class="icon-label">Terminal</div></div>
    </div>

    <!-- MAC OS DOCK -->
    <div id="dock-container">
        <div id="dock">
            <!-- 6 & 7. Dock Launcher Buttons -->
            <div class="dock-item firefox-icon" id="dock-firefox">🦊</div>
            <div class="dock-item terminal-icon" id="dock-terminal">💻</div>
        </div>
    </div>

    <!-- WINDOW: FIREFOX -->
    <div id="win-firefox" class="window">
        <div class="window-header" id="head-firefox">
            <span style="font-size:13px; font-weight:600;">Fake Firefox Browser</span>
            <div class="window-controls">
                <!-- 8, 9, 10. Firefox Control Dots -->
                <div class="control-dot dot-min" id="back-min-firefox"></div>
                <div class="control-dot dot-max" id="back-max-firefox"></div>
                <div class="control-dot dot-close" id="back-close-firefox"></div>
            </div>
        </div>
        <div class="window-content">
            <div class="browser-container">
                <div class="browser-bar"><input type="text" class="browser-input" value="https://www.mozilla.org" readonly></div>
                <div class="browser-page"><h1>Fake Firefox</h1><p>Running cleanly with zero console warnings.</p></div>
            </div>
        </div>
    </div>

    <!-- WINDOW: TERMINAL -->
    <div id="win-terminal" class="window">
        <div class="window-header" id="head-terminal">
            <span style="font-size:13px; font-weight:600;">bash - tty1</span>
            <div class="window-controls">
                <!-- 11, 12, 13. Terminal Control Dots -->
                <div class="control-dot dot-min" id="back-min-terminal"></div>
                <div class="control-dot dot-max" id="back-max-terminal"></div>
                <div class="control-dot dot-close" id="back-close-terminal"></div>
            </div>
        </div>
        <div class="window-content">
            <div class="terminal-body">
                <p>OS Terminal Online. Type 'help' or 'neofetch'.</p><br>
                <div id="terminal-output"></div>
                <div class="terminal-input-line"><span>user@linux-hybrid:~$ &nbsp;</span><input type="text" id="term-input"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Clock Logic ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('clock').innerText = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // --- Core UI Elements ---
        const menuBtn = document.getElementById('menu-btn');
        const appsMenu = document.getElementById('apps-menu');
        const winFirefox = document.getElementById('win-firefox');
        const winTerminal = document.getElementById('win-terminal');
        const taskbarApps = document.getElementById('taskbar-apps');

        function bringToFront(el) { el.style.zIndex = Math.floor(Date.now() / 1000); }

        // --- 1. Toggle Menu Button ---
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            appsMenu.style.display = (appsMenu.style.display === 'flex') ? 'none' : 'flex';
        });
        document.getElementById('desktop').addEventListener('click', () => appsMenu.style.display = 'none');

        // --- App Launcher Core Engine ---
        function openFirefox() {
            appsMenu.style.display = 'none'; winFirefox.style.display = 'flex'; bringToFront(winFirefox);
            if (!document.getElementById('pin-fx')) {
                const pin = document.createElement('button'); pin.className = 'btn'; pin.id = 'pin-fx';
                pin.style.background = 'rgba(59, 130, 246, 0.4)'; pin.innerText = '🦊 Firefox';
                pin.onclick = () => winFirefox.style.display = (winFirefox.style.display === 'none') ? 'flex' : 'none';
                taskbarApps.appendChild(pin);
            }
        }
        function openTerminal() {
            appsMenu.style.display = 'none'; winTerminal.style.display = 'flex'; bringToFront(winTerminal);
            if (!document.getElementById('pin-term')) {
                const pin = document.createElement('button'); pin.className = 'btn'; pin.id = 'pin-term';
                pin.style.background = 'rgba(59, 130, 246, 0.4)'; pin.innerText = '💻 Terminal';
                pin.onclick = () => winTerminal.style.display = (winTerminal.style.display === 'none') ? 'flex' : 'none';
                taskbarApps.appendChild(pin);
            }
        }

        // --- Assigning Direct Handlers to avoid selector loops ---
        document.getElementById('desk-firefox').onclick = openFirefox;
        document.getElementById('dock-firefox').onclick = openFirefox;
        document.getElementById('menu-firefox').onclick = openFirefox;

        document.getElementById('desk-terminal').onclick = openTerminal;
        document.getElementById('dock-terminal').onclick = openTerminal;
        document.getElementById('menu-terminal').onclick = openTerminal;

        // Window Close/Min Dots
        document.getElementById('back-close-firefox').onclick = () => { winFirefox.style.display = 'none'; document.getElementById('pin-fx')?.remove(); };
        document.getElementById('back-min-firefox').onclick = () => winFirefox.style.display = 'none';
        document.getElementById('back-max-firefox').onclick = () => alert("Window maximized!");

        document.getElementById('back-close-terminal').onclick = () => { winTerminal.style.display = 'none'; document.getElementById('pin-term')?.remove(); };
        document.getElementById('back-min-terminal').onclick = () => winTerminal.style.display = 'none';
        document.getElementById('back-max-terminal').onclick = () => alert("Window maximized!");

        // --- Window Drag Setup ---
        function makeDraggable(headerId, winId) {
            const header = document.getElementById(headerId);
            const win = document.getElementById(winId);
            let ox = 0, oy = 0;
            header.onmousedown = (e) => {
                if (e.target.classList.contains('control-dot')) return;
                bringToFront(win);
                ox = e.clientX - win.offsetLeft; oy = e.clientY - win.offsetTop;
                document.onmousemove = (ev) => { win.style.left = `${ev.clientX - ox}px`; win.style.top = `${ev.clientY - oy}px`; };
                document.onmouseup = () => { document.onmousemove = null; document.onmouseup = null; };
            };
        }
        makeDraggable('head-firefox', 'win-firefox');
        makeDraggable('head-terminal', 'win-terminal');

        // --- Terminal Engine ---
        document.getElementById('term-input').onkeydown = (e) => {
            if (e.key === 'Enter') {
                const input = e.target; const val = input.value.trim().toLowerCase();
                const out = document.getElementById('terminal-output');
                let res = val === 'help' ? 'Commands: help, clear, neofetch' : val === 'neofetch' ? 'OS: Hybrid-OS\nKernel: Clean Vanilla DOM DOM\nStatus: 0 Errors' : `bash: command not found: ${val}`;
                if (val === 'clear') { out.innerHTML = ''; input.value = ''; return; }
                if (val) { out.innerHTML += `<div>user@linux-hybrid:~$ ${input.value}</div><div style="margin-bottom:8px; white-space:pre-wrap;">${res}</div>`; }
                input.value = ''; document.querySelector('.terminal-body').scrollTop = document.querySelector('.terminal-body').scrollHeight;
            }
        };
    </script>
</body>
</html>
